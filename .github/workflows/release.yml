name: release

# Run by hand from the Actions tab (or the API) after the PR is merged. It runs the four numerical
# check programs again, then publishes a GitHub release with the paper files in dist/ and the notes
# in .github/RELEASE_NOTES.md. Zenodo archives the release and mints a DOI if the repository is
# switched on at https://zenodo.org/account/settings/github/. The Lean build (OpenAI's 2,900 modules
# from source, several hours and about 20 GB of disk) is run locally with ./run_all.sh; its axiom
# output is recorded in README.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"
      title:
        description: "Release title"
        required: true
        default: "The Pólya–Vinogradov inequality with log log q"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Run the Python, Julia, C and C++ checks
        run: ./run_all.sh --skip-lean

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the paper files
        run: |
          for f in dist/PolyaVinogradovLogLog_final2.pdf dist/PolyaVinogradovLogLog_final2-tex.zip \
                   dist/PolyaVinogradovLogLog_final2-arxiv.tar.gz \
                   preprintPolyaVinogradovLogLog/PolyaVinogradovLogLog.pdf \
                   MasterPolyaVinogradovLogLog_masterzipfinal2.zip; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" dist/PolyaVinogradovLogLog_final2* \
            --target "$TARGET" \
            --title "$TAG: $TITLE" \
            --notes-file .github/RELEASE_NOTES.md
