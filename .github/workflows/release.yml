name: release

# Run by hand from the Actions tab after the pull request is merged. It runs the C and Python
# checks (the Lean build, OpenAI's 2,924 modules compiled from source, takes several hours and
# is run locally with ./run_all.sh; its axiom output is recorded in lean/axioms.txt and in
# README.md), then publishes a GitHub release with the paper files in dist/ and the notes in
# .github/RELEASE_NOTES.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.0.0"
        required: true
        default: "v4.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"
      title:
        description: "Release title"
        required: true
        default: "The Pólya–Vinogradov inequality with log log q for every character"

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: C and Python checks
        run: SKIP_LEAN=1 ./run_all.sh

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the paper files
        run: |
          for f in dist/PolyaVinogradovLogLog_final2.pdf \
                   dist/PolyaVinogradovLogLog_final2-tex.zip \
                   dist/PolyaVinogradovLogLog_final2-arxiv.tar.gz; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" dist/PolyaVinogradovLogLog_final2* \
            --target "$TARGET" \
            --title "$TAG: $TITLE" \
            --notes-file .github/RELEASE_NOTES.md
